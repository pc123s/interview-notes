<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>陕西省 火车站 AOI 围栏索引</title>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,Helvetica,sans-serif; margin: 24px; }
    .card { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .meta { color:#666; margin-bottom: 14px; }
    .list { border: 1px solid rgba(0,0,0,.08); border-radius: 12px; overflow:hidden; }
    .row { display:flex; gap:12px; align-items:center; padding: 10px 12px; border-top: 1px solid rgba(0,0,0,.06); }
    .row:first-child { border-top:0; }
    a { color:#1e60ff; text-decoration:none; }
    a:hover { text-decoration:underline; }
    .name { flex:1; }
    .count { color:#555; }
    code { background: rgba(0,0,0,.04); padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>陕西省 火车站 AOI 围栏索引</h1>
    <div class="meta">点击进入各区县围栏展示页面（HTML）。</div>
    <div class="list" id="list"></div>
    <div class="meta" style="margin-top:16px;">
      输出目录：<code>outputs_aoi/陕西省/火车站/aoi_html</code>
    </div>
  </div>

  <script>
    const entries = [{"title": "西安市_火车站", "html": "西安市_火车站.html", "success": 29, "errors": 66}, {"title": "铜川市_火车站", "html": "铜川市_火车站.html", "success": 9, "errors": 14}, {"title": "宝鸡市_火车站", "html": "宝鸡市_火车站.html", "success": 44, "errors": 142}, {"title": "咸阳市_火车站", "html": "咸阳市_火车站.html", "success": 31, "errors": 137}, {"title": "渭南市_火车站", "html": "渭南市_火车站.html", "success": 43, "errors": 125}, {"title": "延安市_火车站", "html": "延安市_火车站.html", "success": 25, "errors": 80}, {"title": "汉中市_火车站", "html": "汉中市_火车站.html", "success": 33, "errors": 95}, {"title": "榆林市_火车站", "html": "榆林市_火车站.html", "success": 38, "errors": 244}, {"title": "安康市_火车站", "html": "安康市_火车站.html", "success": 35, "errors": 149}, {"title": "商洛市_火车站", "html": "商洛市_火车站.html", "success": 21, "errors": 124}];
    const list = document.getElementById('list');
    entries.forEach(e => {
      const row = document.createElement('div');
      row.className = 'row';
      const name = document.createElement('div');
      name.className = 'name';
      const a = document.createElement('a');
      a.href = e.html;
      a.textContent = e.title;
      a.target = '_blank';
      name.appendChild(a);
      const count = document.createElement('div');
      count.className = 'count';
      count.textContent = `成功: ${e.success} / 失败: ${e.errors}`;
      row.appendChild(name);
      row.appendChild(count);
      list.appendChild(row);
    });
  </script>
</body>
</html>
