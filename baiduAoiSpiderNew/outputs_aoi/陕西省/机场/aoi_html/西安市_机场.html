<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>西安市 机场 围栏</title>
  <style>
    html, body { width:100%; height:100%; margin:0; padding:0; }
    #map { width:100%; height:100%; }
    .panel {
      position:absolute; left:12px; top:12px; background:rgba(255,255,255,0.92);
      padding:10px 12px; border-radius:10px; font-size:13px; max-width:420px; z-index:999;
      box-shadow: 0 6px 20px rgba(0,0,0,.12);
    }
    .list {
      margin-top:8px;
      max-height: 60vh;
      overflow:auto;
      padding-right: 6px;
    }
    .row {
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 0;
      border-bottom: 1px dashed rgba(0,0,0,.08);
    }
    .name {
      flex: 1;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    button {
      border: 1px solid rgba(0,0,0,.15);
      background: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      cursor:pointer;
    }
    button:hover { background: #f5f7ff; }
  </style>
</head>
<body>
  <div class="panel">
    <div style="font-weight:700;">西安市 机场 围栏</div>
    <div style="margin-top:6px;color:#555;">共 2 条（勾选显示围栏）</div>
    <div style="margin-top:8px; display:flex; gap:8px;">
      <button id="btnAll">全选</button>
      <button id="btnNone">全不选</button>
      <button id="btnFit">适配视野</button>
    </div>
    <div class="list" id="list"></div>
  </div>

  <div id="map"></div>
  <script type="text/javascript" src="https://api.map.baidu.com/api?v=3.0&ak=ArKblRbibgjnUw4BqetR6CZEw1Jmur9O"></script>
  <script>
    const items = [{"uid": "71108ff2542438318e772710", "name": "西安航天基地机场", "point_count": 76, "fence": [{"lng": 108.990218, "lat": 34.139322}, {"lng": 108.990252, "lat": 34.136699}, {"lng": 108.990254, "lat": 34.136685}, {"lng": 108.990255, "lat": 34.136673}, {"lng": 108.990254, "lat": 34.136661}, {"lng": 108.99025, "lat": 34.136649}, {"lng": 108.990245, "lat": 34.136638}, {"lng": 108.990238, "lat": 34.136628}, {"lng": 108.99023, "lat": 34.136619}, {"lng": 108.99022, "lat": 34.136612}, {"lng": 108.990162, "lat": 34.136572}, {"lng": 108.989819, "lat": 34.136472}, {"lng": 108.989809, "lat": 34.136468}, {"lng": 108.9898, "lat": 34.136463}, {"lng": 108.989792, "lat": 34.136455}, {"lng": 108.989786, "lat": 34.136446}, {"lng": 108.989783, "lat": 34.136435}, {"lng": 108.989782, "lat": 34.136424}, {"lng": 108.989784, "lat": 34.136414}, {"lng": 108.989999, "lat": 34.135836}, {"lng": 108.990049, "lat": 34.135789}, {"lng": 108.990103, "lat": 34.135755}, {"lng": 108.990115, "lat": 34.135748}, {"lng": 108.990129, "lat": 34.135743}, {"lng": 108.990142, "lat": 34.13574}, {"lng": 108.990156, "lat": 34.135738}, {"lng": 108.99017, "lat": 34.135737}, {"lng": 108.990184, "lat": 34.135738}, {"lng": 108.990198, "lat": 34.135741}, {"lng": 108.991587, "lat": 34.136103}, {"lng": 108.994941, "lat": 34.136947}, {"lng": 109.000003, "lat": 34.138198}, {"lng": 109.002427, "lat": 34.138829}, {"lng": 109.002438, "lat": 34.138832}, {"lng": 109.002447, "lat": 34.138837}, {"lng": 109.002455, "lat": 34.138844}, {"lng": 109.002461, "lat": 34.138854}, {"lng": 109.002464, "lat": 34.138864}, {"lng": 109.002465, "lat": 34.138875}, {"lng": 109.002464, "lat": 34.138885}, {"lng": 109.002043, "lat": 34.140073}, {"lng": 109.002037, "lat": 34.140082}, {"lng": 109.002029, "lat": 34.140091}, {"lng": 109.00202, "lat": 34.140097}, {"lng": 109.002009, "lat": 34.140102}, {"lng": 109.001998, "lat": 34.140104}, {"lng": 109.001987, "lat": 34.140104}, {"lng": 109.001976, "lat": 34.140102}, {"lng": 108.996445, "lat": 34.1386}, {"lng": 108.996433, "lat": 34.138597}, {"lng": 108.996421, "lat": 34.138597}, {"lng": 108.99641, "lat": 34.138599}, {"lng": 108.996398, "lat": 34.138603}, {"lng": 108.996388, "lat": 34.13861}, {"lng": 108.996379, "lat": 34.138618}, {"lng": 108.996372, "lat": 34.138627}, {"lng": 108.996041, "lat": 34.139267}, {"lng": 108.996034, "lat": 34.139277}, {"lng": 108.996025, "lat": 34.139287}, {"lng": 108.996014, "lat": 34.139295}, {"lng": 108.996003, "lat": 34.139301}, {"lng": 108.995991, "lat": 34.139305}, {"lng": 108.995978, "lat": 34.139307}, {"lng": 108.995965, "lat": 34.139308}, {"lng": 108.994469, "lat": 34.139289}, {"lng": 108.993625, "lat": 34.139309}, {"lng": 108.992954, "lat": 34.1393}, {"lng": 108.990398, "lat": 34.139377}, {"lng": 108.990272, "lat": 34.13937}, {"lng": 108.99026, "lat": 34.139369}, {"lng": 108.990249, "lat": 34.139366}, {"lng": 108.99024, "lat": 34.13936}, {"lng": 108.990231, "lat": 34.139353}, {"lng": 108.990225, "lat": 34.139344}, {"lng": 108.99022, "lat": 34.139333}, {"lng": 108.990218, "lat": 34.139322}]}, {"uid": "7ac216108ab2ac26a80dd840", "name": "西安蓝田机场", "point_count": 13, "fence": [{"lng": 109.173575, "lat": 34.083687}, {"lng": 109.176709, "lat": 34.086058}, {"lng": 109.17787, "lat": 34.08507}, {"lng": 109.180392, "lat": 34.08705}, {"lng": 109.182393, "lat": 34.088591}, {"lng": 109.183951, "lat": 34.089986}, {"lng": 109.186966, "lat": 34.092181}, {"lng": 109.186407, "lat": 34.093843}, {"lng": 109.184574, "lat": 34.09562}, {"lng": 109.177961, "lat": 34.090734}, {"lng": 109.171425, "lat": 34.085731}, {"lng": 109.173498, "lat": 34.083666}, {"lng": 109.173575, "lat": 34.083687}]}];
    const map = new BMap.Map("map");
    map.centerAndZoom(new BMap.Point(116.404, 39.915), 12);
    map.enableScrollWheelZoom(true);

    const overlays = new Map(); // uid -> polygon

    function buildPolygon(item) {
      const pts = item.fence.map(p => new BMap.Point(p.lng, p.lat));
      const poly = new BMap.Polygon(pts, {
        strokeColor: "#1e90ff",
        strokeWeight: 2,
        strokeOpacity: 0.9,
        fillColor: "#1e90ff",
        fillOpacity: 0.25
      });
      return poly;
    }

    function ensureOverlay(item) {
      if (overlays.has(item.uid)) return overlays.get(item.uid);
      const poly = buildPolygon(item);
      overlays.set(item.uid, poly);
      return poly;
    }

    function setVisible(item, visible) {
      const poly = ensureOverlay(item);
      if (visible) {
        map.addOverlay(poly);
      } else {
        map.removeOverlay(poly);
      }
    }

    function fitViewport() {
      const polys = [];
      overlays.forEach((poly) => {
        // 仅对当前在地图上的 overlay 生效
        // 百度 Map API 无直接判断是否已 addOverlay，这里用 getMap() 规避
        if (poly.getMap && poly.getMap()) polys.push(poly);
      });
      if (polys.length === 0) return;
      const bounds = polys[0].getBounds();
      for (let i = 1; i < polys.length; i++) {
        bounds.extend(polys[i].getBounds().getSouthWest());
        bounds.extend(polys[i].getBounds().getNorthEast());
      }
      map.setViewport(bounds);
    }

    const listEl = document.getElementById("list");
    items.forEach((item, idx) => {
      const row = document.createElement("div");
      row.className = "row";

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = false;
      cb.addEventListener("change", () => {
        setVisible(item, cb.checked);
      });

      const name = document.createElement("div");
      name.className = "name";
      name.title = item.name + " (" + item.uid + ")";
      name.textContent = (idx+1) + ". " + item.name + "  [" + item.point_count + "点]";
      name.addEventListener("click", () => {
        const poly = ensureOverlay(item);
        map.addOverlay(poly);
        cb.checked = true;
        map.setViewport(poly.getBounds());
      });

      row.appendChild(cb);
      row.appendChild(name);
      listEl.appendChild(row);
    });

    document.getElementById("btnAll").addEventListener("click", () => {
      listEl.querySelectorAll("input[type=checkbox]").forEach((cb, i) => {
        if (!cb.checked) {
          cb.checked = true;
          setVisible(items[i], true);
        }
      });
      fitViewport();
    });

    document.getElementById("btnNone").addEventListener("click", () => {
      listEl.querySelectorAll("input[type=checkbox]").forEach((cb, i) => {
        if (cb.checked) {
          cb.checked = false;
          setVisible(items[i], false);
        }
      });
    });

    document.getElementById("btnFit").addEventListener("click", () => {
      fitViewport();
    });
  </script>
</body>
</html>
