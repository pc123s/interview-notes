<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>宝鸡市 机场 围栏</title>
  <style>
    html, body { width:100%; height:100%; margin:0; padding:0; }
    #map { width:100%; height:100%; }
    .panel {
      position:absolute; left:12px; top:12px; background:rgba(255,255,255,0.92);
      padding:10px 12px; border-radius:10px; font-size:13px; max-width:420px; z-index:999;
      box-shadow: 0 6px 20px rgba(0,0,0,.12);
    }
    .list {
      margin-top:8px;
      max-height: 60vh;
      overflow:auto;
      padding-right: 6px;
    }
    .row {
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 0;
      border-bottom: 1px dashed rgba(0,0,0,.08);
    }
    .name {
      flex: 1;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    button {
      border: 1px solid rgba(0,0,0,.15);
      background: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      cursor:pointer;
    }
    button:hover { background: #f5f7ff; }
  </style>
</head>
<body>
  <div class="panel">
    <div style="font-weight:700;">宝鸡市 机场 围栏</div>
    <div style="margin-top:6px;color:#555;">共 1 条（勾选显示围栏）</div>
    <div style="margin-top:8px; display:flex; gap:8px;">
      <button id="btnAll">全选</button>
      <button id="btnNone">全不选</button>
      <button id="btnFit">适配视野</button>
    </div>
    <div class="list" id="list"></div>
  </div>

  <div id="map"></div>
  <script type="text/javascript" src="https://api.map.baidu.com/api?v=3.0&ak=ArKblRbibgjnUw4BqetR6CZEw1Jmur9O"></script>
  <script>
    const items = [{"uid": "044fbd3b29a0b447f42310a5", "name": "宝鸡太白山机场", "point_count": 96, "fence": [{"lng": 107.914065, "lat": 34.167523}, {"lng": 107.914059, "lat": 34.167523}, {"lng": 107.91178, "lat": 34.16757}, {"lng": 107.911774, "lat": 34.16757}, {"lng": 107.911769, "lat": 34.167569}, {"lng": 107.911764, "lat": 34.167568}, {"lng": 107.91176, "lat": 34.167566}, {"lng": 107.911755, "lat": 34.167563}, {"lng": 107.911751, "lat": 34.16756}, {"lng": 107.911747, "lat": 34.167556}, {"lng": 107.911744, "lat": 34.167552}, {"lng": 107.911742, "lat": 34.167547}, {"lng": 107.91174, "lat": 34.167543}, {"lng": 107.911739, "lat": 34.167538}, {"lng": 107.911738, "lat": 34.167532}, {"lng": 107.911738, "lat": 34.167527}, {"lng": 107.911738, "lat": 34.167522}, {"lng": 107.912093, "lat": 34.165877}, {"lng": 107.912094, "lat": 34.165872}, {"lng": 107.912096, "lat": 34.165867}, {"lng": 107.912097, "lat": 34.165862}, {"lng": 107.912099, "lat": 34.165858}, {"lng": 107.912102, "lat": 34.165853}, {"lng": 107.912105, "lat": 34.165849}, {"lng": 107.912108, "lat": 34.165845}, {"lng": 107.912111, "lat": 34.165841}, {"lng": 107.912115, "lat": 34.165838}, {"lng": 107.912119, "lat": 34.165834}, {"lng": 107.912123, "lat": 34.165831}, {"lng": 107.912128, "lat": 34.165829}, {"lng": 107.912132, "lat": 34.165827}, {"lng": 107.912137, "lat": 34.165825}, {"lng": 107.912142, "lat": 34.165823}, {"lng": 107.912147, "lat": 34.165822}, {"lng": 107.912152, "lat": 34.165821}, {"lng": 107.921752, "lat": 34.164573}, {"lng": 107.921757, "lat": 34.164573}, {"lng": 107.921762, "lat": 34.164572}, {"lng": 107.921767, "lat": 34.164572}, {"lng": 107.921772, "lat": 34.164573}, {"lng": 107.921778, "lat": 34.164573}, {"lng": 107.921783, "lat": 34.164574}, {"lng": 107.921788, "lat": 34.164575}, {"lng": 107.921793, "lat": 34.164576}, {"lng": 107.921798, "lat": 34.164578}, {"lng": 107.921803, "lat": 34.164579}, {"lng": 107.921807, "lat": 34.164581}, {"lng": 107.921812, "lat": 34.164584}, {"lng": 107.921817, "lat": 34.164586}, {"lng": 107.921821, "lat": 34.164589}, {"lng": 107.921825, "lat": 34.164592}, {"lng": 107.921829, "lat": 34.164595}, {"lng": 107.921833, "lat": 34.164598}, {"lng": 107.921837, "lat": 34.164602}, {"lng": 107.922532, "lat": 34.165251}, {"lng": 107.922535, "lat": 34.165255}, {"lng": 107.922538, "lat": 34.16526}, {"lng": 107.922539, "lat": 34.165266}, {"lng": 107.922539, "lat": 34.165271}, {"lng": 107.922538, "lat": 34.165276}, {"lng": 107.922535, "lat": 34.165281}, {"lng": 107.922532, "lat": 34.165286}, {"lng": 107.922528, "lat": 34.165289}, {"lng": 107.922523, "lat": 34.165291}, {"lng": 107.922517, "lat": 34.165293}, {"lng": 107.91408, "lat": 34.166381}, {"lng": 107.914075, "lat": 34.166382}, {"lng": 107.91407, "lat": 34.166384}, {"lng": 107.914065, "lat": 34.166386}, {"lng": 107.91406, "lat": 34.166388}, {"lng": 107.914056, "lat": 34.166391}, {"lng": 107.914052, "lat": 34.166395}, {"lng": 107.914048, "lat": 34.166398}, {"lng": 107.914044, "lat": 34.166403}, {"lng": 107.914041, "lat": 34.166407}, {"lng": 107.914039, "lat": 34.166412}, {"lng": 107.914037, "lat": 34.166417}, {"lng": 107.914035, "lat": 34.166422}, {"lng": 107.914034, "lat": 34.166427}, {"lng": 107.914034, "lat": 34.166432}, {"lng": 107.914034, "lat": 34.166438}, {"lng": 107.914106, "lat": 34.167473}, {"lng": 107.914106, "lat": 34.167478}, {"lng": 107.914106, "lat": 34.167483}, {"lng": 107.914105, "lat": 34.167488}, {"lng": 107.914103, "lat": 34.167493}, {"lng": 107.914101, "lat": 34.167497}, {"lng": 107.914098, "lat": 34.167502}, {"lng": 107.914095, "lat": 34.167506}, {"lng": 107.914092, "lat": 34.16751}, {"lng": 107.914088, "lat": 34.167513}, {"lng": 107.914084, "lat": 34.167516}, {"lng": 107.914079, "lat": 34.167519}, {"lng": 107.914075, "lat": 34.167521}, {"lng": 107.91407, "lat": 34.167522}, {"lng": 107.914065, "lat": 34.167523}]}];
    const map = new BMap.Map("map");
    map.centerAndZoom(new BMap.Point(116.404, 39.915), 12);
    map.enableScrollWheelZoom(true);

    const overlays = new Map(); // uid -> polygon

    function buildPolygon(item) {
      const pts = item.fence.map(p => new BMap.Point(p.lng, p.lat));
      const poly = new BMap.Polygon(pts, {
        strokeColor: "#1e90ff",
        strokeWeight: 2,
        strokeOpacity: 0.9,
        fillColor: "#1e90ff",
        fillOpacity: 0.25
      });
      return poly;
    }

    function ensureOverlay(item) {
      if (overlays.has(item.uid)) return overlays.get(item.uid);
      const poly = buildPolygon(item);
      overlays.set(item.uid, poly);
      return poly;
    }

    function setVisible(item, visible) {
      const poly = ensureOverlay(item);
      if (visible) {
        map.addOverlay(poly);
      } else {
        map.removeOverlay(poly);
      }
    }

    function fitViewport() {
      const polys = [];
      overlays.forEach((poly) => {
        // 仅对当前在地图上的 overlay 生效
        // 百度 Map API 无直接判断是否已 addOverlay，这里用 getMap() 规避
        if (poly.getMap && poly.getMap()) polys.push(poly);
      });
      if (polys.length === 0) return;
      const bounds = polys[0].getBounds();
      for (let i = 1; i < polys.length; i++) {
        bounds.extend(polys[i].getBounds().getSouthWest());
        bounds.extend(polys[i].getBounds().getNorthEast());
      }
      map.setViewport(bounds);
    }

    const listEl = document.getElementById("list");
    items.forEach((item, idx) => {
      const row = document.createElement("div");
      row.className = "row";

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = false;
      cb.addEventListener("change", () => {
        setVisible(item, cb.checked);
      });

      const name = document.createElement("div");
      name.className = "name";
      name.title = item.name + " (" + item.uid + ")";
      name.textContent = (idx+1) + ". " + item.name + "  [" + item.point_count + "点]";
      name.addEventListener("click", () => {
        const poly = ensureOverlay(item);
        map.addOverlay(poly);
        cb.checked = true;
        map.setViewport(poly.getBounds());
      });

      row.appendChild(cb);
      row.appendChild(name);
      listEl.appendChild(row);
    });

    document.getElementById("btnAll").addEventListener("click", () => {
      listEl.querySelectorAll("input[type=checkbox]").forEach((cb, i) => {
        if (!cb.checked) {
          cb.checked = true;
          setVisible(items[i], true);
        }
      });
      fitViewport();
    });

    document.getElementById("btnNone").addEventListener("click", () => {
      listEl.querySelectorAll("input[type=checkbox]").forEach((cb, i) => {
        if (cb.checked) {
          cb.checked = false;
          setVisible(items[i], false);
        }
      });
    });

    document.getElementById("btnFit").addEventListener("click", () => {
      fitViewport();
    });
  </script>
</body>
</html>
