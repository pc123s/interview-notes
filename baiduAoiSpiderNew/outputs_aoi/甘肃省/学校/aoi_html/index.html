<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>甘肃省 学校 AOI 围栏索引</title>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,Helvetica,sans-serif; margin: 24px; }
    .card { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .meta { color:#666; margin-bottom: 14px; }
    .list { border: 1px solid rgba(0,0,0,.08); border-radius: 12px; overflow:hidden; }
    .row { display:flex; gap:12px; align-items:center; padding: 10px 12px; border-top: 1px solid rgba(0,0,0,.06); }
    .row:first-child { border-top:0; }
    a { color:#1e60ff; text-decoration:none; }
    a:hover { text-decoration:underline; }
    .name { flex:1; }
    .count { color:#555; }
    code { background: rgba(0,0,0,.04); padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>甘肃省 学校 AOI 围栏索引</h1>
    <div class="meta">点击进入各区县围栏展示页面（HTML）。</div>
    <div class="list" id="list"></div>
    <div class="meta" style="margin-top:16px;">
      输出目录：<code>outputs_aoi/甘肃省/学校/aoi_html</code>
    </div>
  </div>

  <script>
    const entries = [{"title": "兰州市_学校", "html": "兰州市_学校.html", "success": 257, "errors": 267}, {"title": "嘉峪关市_学校", "html": "嘉峪关市_学校.html", "success": 37, "errors": 88}, {"title": "金昌市_学校", "html": "金昌市_学校.html", "success": 57, "errors": 96}, {"title": "白银市_学校", "html": "白银市_学校.html", "success": 253, "errors": 232}, {"title": "天水市_学校", "html": "天水市_学校.html", "success": 300, "errors": 311}, {"title": "武威市_学校", "html": "武威市_学校.html", "success": 194, "errors": 149}, {"title": "张掖市_学校", "html": "张掖市_学校.html", "success": 156, "errors": 175}, {"title": "平凉市_学校", "html": "平凉市_学校.html", "success": 298, "errors": 236}, {"title": "酒泉市_学校", "html": "酒泉市_学校.html", "success": 141, "errors": 181}, {"title": "庆阳市_学校", "html": "庆阳市_学校.html", "success": 433, "errors": 348}, {"title": "定西市_学校", "html": "定西市_学校.html", "success": 394, "errors": 343}, {"title": "陇南市_学校", "html": "陇南市_学校.html", "success": 265, "errors": 415}, {"title": "临夏回族自治州_学校", "html": "临夏回族自治州_学校.html", "success": 335, "errors": 224}, {"title": "甘南藏族自治州_学校", "html": "甘南藏族自治州_学校.html", "success": 117, "errors": 118}];
    const list = document.getElementById('list');
    entries.forEach(e => {
      const row = document.createElement('div');
      row.className = 'row';
      const name = document.createElement('div');
      name.className = 'name';
      const a = document.createElement('a');
      a.href = e.html;
      a.textContent = e.title;
      a.target = '_blank';
      name.appendChild(a);
      const count = document.createElement('div');
      count.className = 'count';
      count.textContent = `成功: ${e.success} / 失败: ${e.errors}`;
      row.appendChild(name);
      row.appendChild(count);
      list.appendChild(row);
    });
  </script>
</body>
</html>
