 [{"lng": 94.593832, "lat": 40.117624}, {"lng": 94.593823, "lat": 40.117618}, {"lng": 94.593816, "lat": 40.11761}, {"lng": 94.593812, "lat": 40.117601}, {"lng": 94.593811, "lat": 40.117591}, {"lng": 94.593812, "lat": 40.11758}, {"lng": 94.593817, "lat": 40.117571}, {"lng": 94.593824, "lat": 40.117563}, {"lng": 94.595504, "lat": 40.116102}, {"lng": 94.595514, "lat": 40.116095}, {"lng": 94.595526, "lat": 40.11609}, {"lng": 94.595538, "lat": 40.116087}, {"lng": 94.59555, "lat": 40.116087}, {"lng": 94.595563, "lat": 40.116089}, {"lng": 94.595574, "lat": 40.116093}, {"lng": 94.595585, "lat": 40.116099}, {"lng": 94.597069, "lat": 40.117207}, {"lng": 94.597077, "lat": 40.117214}, {"lng": 94.597083, "lat": 40.117223}, {"lng": 94.597086, "lat": 40.117233}, {"lng": 94.597085, "lat": 40.117243}, {"lng": 94.597082, "lat": 40.117254}, {"lng": 94.597076, "lat": 40.117263}, {"lng": 94.597068, "lat": 40.117269}, {"lng": 94.595419, "lat": 40.118461}, {"lng": 94.595407, "lat": 40.118468}, {"lng": 94.595394, "lat": 40.118473}, {"lng": 94.595381, "lat": 40.118475}, {"lng": 94.595367, "lat": 40.118476}, {"lng": 94.595354, "lat": 40.118475}, {"lng": 94.595341, "lat": 40.118471}, {"lng": 94.595328, "lat": 40.118466}, {"lng": 94.593832, "lat": 40.117624}]}];
    const map = new BMap.Map("map");
    map.centerAndZoom(new BMap.Point(116.404, 39.915), 12);
    map.enableScrollWheelZoom(true);

    const overlays = new Map(); // uid -> polygon

    function buildPolygon(item) {
      const pts = item.fence.map(p => new BMap.Point(p.lng, p.lat));
      const poly = new BMap.Polygon(pts, {
        strokeColor: "#1e90ff",
        strokeWeight: 2,
        strokeOpacity: 0.9,
        fillColor: "#1e90ff",
        fillOpacity: 0.25
      });
      return poly;
    }

    function ensureOverlay(item) {
      if (overlays.has(item.uid)) return overlays.get(item.uid);
      const poly = buildPolygon(item);
      overlays.set(item.uid, poly);
      return poly;
    }

    function setVisible(item, visible) {
      const poly = ensureOverlay(item);
      if (visible) {
        map.addOverlay(poly);
      } else {
        map.removeOverlay(poly);
      }
    }

    function fitViewport() {
      const polys = [];
      overlays.forEach((poly) => {
        // 仅对当前在地图上的 overlay 生效
        // 百度 Map API 无直接判断是否已 addOverlay，这里用 getMap() 规避
        if (poly.getMap && poly.getMap()) polys.push(poly);
      });
      if (polys.length === 0) return;
      const bounds = polys[0].getBounds();
      for (let i = 1; i < polys.length; i++) {
        bounds.extend(polys[i].getBounds().getSouthWest());
        bounds.extend(polys[i].getBounds().getNorthEast());
      }
      map.setViewport(bounds);
    }

    const listEl = document.getElementById("list");
    items.forEach((item, idx) => {
      const row = document.createElement("div");
      row.className = "row";

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = false;
      cb.addEventListener("change", () => {
        setVisible(item, cb.checked);
      });

      const name = document.createElement("div");
      name.className = "name";
      name.title = item.name + " (" + item.uid + ")";
      name.textContent = (idx+1) + ". " + item.name + "  [" + item.point_count + "点]";
      name.addEventListener("click", () => {
        const poly = ensureOverlay(item);
        map.addOverlay(poly);
        cb.checked = true;
        map.setViewport(poly.getBounds());
      });

      row.appendChild(cb);
      row.appendChild(name);
      listEl.appendChild(row);
    });

    document.getElementById("btnAll").addEventListener("click", () => {
      listEl.querySelectorAll("input[type=checkbox]").forEach((cb, i) => {
        if (!cb.checked) {
          cb.checked = true;
          setVisible(items[i], true);
        }
      });
      fitViewport();
    });

    document.getElementById("btnNone").addEventListener("click", () => {
      listEl.querySelectorAll("input[type=checkbox]").forEach((cb, i) => {
        if (cb.checked) {
          cb.checked = false;
          setVisible(items[i], false);
        }
      });
    });

    document.getElementById("btnFit").addEventListener("click", () => {
      fitViewport();
    });
  </script>
